name: Verificar site

# O site é publicado em https://iasemlimites.github.io/ pelo repositório
# iasemlimites/iasemlimites.github.io, que lê este repositório de 30 em 30 minutos.
# Aqui só se confirma que o site continua a gerar sem erros a cada alteração.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 site/gerar.py --saida _site
